apiVersion: v1
kind: Namespace
metadata:
  name: shared-services
  labels:
    app.kubernetes.io/name: shared-services
    app.kubernetes.io/part-of: dinovatech-saas
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weasyprint
  namespace: shared-services
  labels:
    app: weasyprint
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weasyprint
  template:
    metadata:
      labels:
        app: weasyprint
    spec:
      containers:
        - name: weasyprint
          image: ghcr.io/schweizerischebundesbahnen/weasyprint-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9080
          resources:
            requests:
              cpu: 100m
              memory: 80Mi
            limits:
              cpu: 1000m
              memory: 400Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 9080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 9080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: weasyprint
  namespace: shared-services
  labels:
    app: weasyprint
spec:
  type: ClusterIP
  selector:
    app: weasyprint
  ports:
    - name: http
      port: 9080
      targetPort: 9080
      protocol: TCP
