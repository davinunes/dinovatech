apiVersion: v1
kind: Namespace
metadata:
  name: ingress-caddy
  labels:
    app.kubernetes.io/name: ingress-caddy
    app.kubernetes.io/part-of: dinovatech-saas
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: caddy-data
  namespace: ingress-caddy
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-config
  namespace: ingress-caddy
data:
  Caddyfile: |
    {
        email admin@dinovatech.com.br
        on_demand_tls {
            ask http://localhost:80/ask
        }
        log {
            output stdout
            format console
            level INFO
        }
    }

    # Health check, ask endpoint e página padrão na porta 80
    :80 {
        handle /healthz {
            respond "OK" 200
        }
        handle /ask {
            respond 200
        }
        handle {
            respond "Dinovatech SaaS Ingress (Caddy) - Aguardando roteamento de tenant" 200
        }
    }

    # Roteamento HTTPS com On-Demand TLS
    :443 {
        tls {
            on_demand
        }
        handle /healthz {
            respond "OK" 200
        }
        handle {
            respond "Dinovatech SaaS Ingress (Caddy SSL) - Roteador Ativo" 200
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy-ingress
  namespace: ingress-caddy
  labels:
    app: caddy-ingress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: caddy-ingress
  template:
    metadata:
      labels:
        app: caddy-ingress
    spec:
      containers:
        - name: caddy
          image: caddy:alpine
          imagePullPolicy: IfNotPresent
          command:
            - caddy
          args:
            - run
            - --config
            - /etc/caddy/Caddyfile
            - --adapter
            - caddyfile
          ports:
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: caddy-data
              mountPath: /data
            - name: caddy-config
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: caddy-data
          persistentVolumeClaim:
            claimName: caddy-data
        - name: caddy-config
          configMap:
            name: caddy-config
---
apiVersion: v1
kind: Service
metadata:
  name: caddy-service
  namespace: ingress-caddy
  labels:
    app: caddy-ingress
spec:
  type: LoadBalancer
  selector:
    app: caddy-ingress
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
