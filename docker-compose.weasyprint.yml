version: '3.8'

services:
  weasyprint:
    image: ghcr.io/schweizerischebundesbahnen/weasyprint-service:latest
    container_name: weasyprint
    restart: unless-stopped
    init: true
    ports:
      # Expõe a porta 9080 para a máquina local / host
      - "9080:9080"
    deploy:
      resources:
        limits:
          # Limite de memória para proteger o Free Tier (1GB RAM)
          memory: 350M
        reservations:
          memory: 80M
    environment:
      # Configuração de timezone opcional
      - TZ=America/Sao_Paulo
    # Caso sua stack do PHP utilize uma rede Docker compartilhada, descomente e ajuste:
    # networks:
    #   - dinovatech-net

# networks:
#   dinovatech-net:
#     external: true
